<style>

    --paper: #F6F8FC;
    --surface: #FFFFFF;
    --grid: rgba(43, 75, 219, 0.10);
    --ink: #16213E;
    --muted: #56617F;
    --line: #C3CCE2;
    --pen: #2B4BDB;
    --marker: #FFE14D;
    --red: #C8372B;

    gap: 10px;
    padding: 6px 16px 6px 8px;

    color: #16213E;
    border: 2px solid #16213E;
    border-radius: 999px;
    box-shadow: 3px 3px 0 #16213E;
    text-decoration: none;
    transform: rotate(-1.2deg);

  .made:hover, .made:focus-visible { transform: rotate(0deg) translateY(-1px); box-shadow: 4px 4px 0 #16213E; }

  .made-text { display: flex; flex-direction: column; line-height: 1.15; }
  .made-main { font: 500 0.95rem var(--font-body); }
  .made-main strong { font: 700 1.02rem var(--font-display); letter-spacing: -0.01em; }
  .made-url { font: 500 0.74rem var(--font-body); opacity: 0.8; }

  .lang { margin-left: auto; display: flex; gap: 6px; }
  .lang button {
    font: 600 0.85rem var(--font-body);
    padding: 0.3rem 0.7rem;
    border: 2px solid var(--ink);
    border-radius: 6px;
    background: var(--surface);
    color: var(--ink);
    cursor: pointer;

  .modes { display: flex; flex-wrap: wrap; gap: 10px; margin: 0 0 18px; }
  .mode, .chip {
    font: 600 0.95rem var(--font-body);
    padding: 0.55rem 1rem;
    border: 2px solid var(--ink);
    border-radius: 6px;
    background: var(--surface);
    color: var(--ink);
    cursor: pointer;

  .mode:hover, .chip:hover { background: var(--marker); color: #16213E; }

    color: var(--muted);
    cursor: pointer;

    color: var(--paper);
    border: 2px solid var(--ink);
    border-radius: 6px;
    cursor: pointer;

  .btn:hover:not(:disabled) { background: var(--marker); color: #16213E; }

  .btn.ghost { background: transparent; color: var(--ink); }

  .hint { margin: 6px 0 0; font-size: 0.82rem; color: var(--muted); }

  .res li:last-child { border-bottom: 1px dashed var(--line); }
  .res-title { font-weight: 600; }
  .res-meta { color: var(--muted); font-size: 0.92rem; }
  .res-note { margin: 2px 0 8px; }
  .links { display: flex; flex-wrap: wrap; gap: 8px; }
  .link {

    font: 600 0.88rem var(--font-body);
    padding: 0.35rem 0.8rem;

    color: var(--ink);

  .library .sub { margin: 0 0 14px; color: var(--muted); max-width: 62ch; }
  .chips { display: flex; flex-wrap: wrap; gap: 10px; margin: 0 0 22px; }
  .topic-intro { margin: 0 0 14px; max-width: 62ch; }
  .legend { margin: 0 0 14px; font-size: 0.88rem; color: var(--muted); max-width: 70ch; }

  .idea { border: 2px solid var(--ink); background: var(--surface); margin: 0 0 14px; border-radius: 6px; }

  .sample { margin: 28px 0 0; }
  .sample h2, .method h2 { margin: 0 0 6px; font: 700 clamp(1.3rem, 3.4vw, 1.7rem)/1.2 var(--font-display); letter-spacing: -0.01em; }
  .sample .sub { margin: 0 0 14px; color: var(--muted); max-width: 62ch; }
  .tag-sample { display: inline-block; margin: 0 0 8px; padding: 0.15rem 0.6rem; background: var(--marker); color: #16213E; border: 2px solid #16213E; border-radius: 6px; font: 600 0.8rem var(--font-body); }
  .sample .cta-row { margin: 14px 0 0; }
  .notice { margin: 0 0 14px; padding: 10px 14px; border: 2px dashed var(--muted); border-radius: 6px; font-size: 0.9rem; color: var(--muted); max-width: 70ch; }
  .notice strong { color: var(--ink); }
  .ai-cap { margin: 0 0 6px; font-size: 0.8rem; color: var(--muted); }
  .check { border-left: 4px solid var(--pen); padding-left: 12px; margin-top: 12px; }
  .method { margin: 40px 0 0; padding: 24px 0 0; border-top: 2px solid var(--ink); }
  .method p, .method li { max-width: 68ch; }
  .method ul { margin: 0 0 12px; padding-left: 1.3rem; }
  .method h3 { margin: 16px 0 4px; font: 600 1rem var(--font-body); }

  footer { margin: 40px 0 0; padding: 20px 0 48px; border-top: 1px dashed var(--line); color: var(--muted); font-size: 0.88rem; }
  footer p { margin: 0 0 8px; max-width: 72ch; }

  noscript p { padding: 16px; background: var(--marker); color: #16213E; }

  @media (max-width: 560px) {
    .agent, .result-card { padding: 16px; }
    .idea summary { grid-template-columns: 1fr; }
    .idea .scores { grid-column: 1; grid-row: auto; }
    .toggle { order: 5; }
  }

  @media (prefers-reduced-motion: reduce) {
    .verdict, .made { transform: none; transition: none; }
  }
</style>

  var LANG = "ru";

  function el(tag, props, children) {
    var node = document.createElement(tag);
    if (props) {
      Object.keys(props).forEach(function (key) {
        if (key === "class") node.className = props[key];
        else if (key === "text") node.textContent = props[key];
        else node.setAttribute(key, props[key]);
      });
    }
    (children || []).forEach(function (child) { if (child) node.appendChild(child); });
    return node;
  }

  function dots(value, label) {
    var wrap = el("dd", { role: "img", "aria-label": label + ": " + value + " " + t("outOf") });
    for (var i = 1; i <= 5; i++) wrap.appendChild(el("span", { class: "dot" + (i <= value ? " on" : "") }));
    return wrap;
  }

  function scoresBlock(scores) {
    var dl = el("dl", { class: "scores" });
    SCORE_KEYS.forEach(function (k) {
      var label = t("score")[k];

  /* ---------- Материалы ---------- */

  function q(s) { return encodeURIComponent(s); }

  function view(r) {
    var en = LANG === "en" ? (RES_EN[r.title] || {}) : {};
    return { title: en.title || r.title, by: en.by || r.by, note: en.note || r.note };
  }

  function linksFor(r) {
    var out = [];
    function a(text, href, secondary) {
      out.push(el("a", { class: "link" + (secondary ? " secondary" : ""), href: href, target: "_blank", rel: "noopener noreferrer", text: text }));
    }
    var v = view(r);
    var search = r.find || r.title;
    if (r.url) a(t("open"), r.url, false);
    if (r.type === "book") {
      if (LANG === "ru") {
        a(t("findLitres"), "https://www.litres.ru/search/?q=" + q(r.findRu || search), !!r.url);
        a(t("findGoodreads"), "https://www.goodreads.com/search?q=" + q(search), true);
      } else {
        a(t("findAmazon"), "https://www.amazon.com/s?k=" + q(search), !!r.url);
        a(t("findGoodreads"), "https://www.goodreads.com/search?q=" + q(search), true);
      }
    } else if (r.type === "podcast") {
      if (!r.url) a(t("findYoutube"), "https://www.youtube.com/results?search_query=" + q(search), false);
      if (LANG === "ru") a(t("findYandexPod"), "https://yandex.ru/search/?text=" + q(search + " подкаст"), true);
      else a(t("findYandexPod"), "https://www.google.com/search?q=" + q(search + " podcast"), true);
    } else if (!r.url) {
      if (LANG === "ru") a(t("findYandex"), "https://yandex.ru/search/?text=" + q(search), false);
      else a(t("findGoogle"), "https://www.google.com/search?q=" + q(v.title + " " + v.by), false);
    }
    return out;
  }

  function relevance(r, tags) {
    var s = 0;
    r.tags.forEach(function (tg) { if (tags.indexOf(tg) !== -1) s += 1; });
    if (s > 0 && r.lang === LANG) s += 0.5;
    return s;
  }

  function pick(type, tags, limit) {
    return resources
      .filter(function (r) { return r.type === type; })
      .map(function (r) { return { r: r, s: relevance(r, tags) }; })
      .filter(function (x) { return x.s > 0; })
      .sort(function (a, b) { return b.s - a.s; })
      .slice(0, limit)
      .map(function (x) { return x.r; });
  }

  function resourceList(items) {
    var ul = el("ul", { class: "res" });
    items.forEach(function (r) {
      var v = view(r);
      var meta = v.by + " · " + (r.lang === "ru" ? t("inRu") : t("inEn"));
      ul.appendChild(el("li", null, [
        el("div", null, [el("span", { class: "res-title", text: v.title }), el("span", { class: "res-meta", text: " — " + meta })]),
        el("p", { class: "res-note", text: v.note }),
        el("div", { class: "links" }, linksFor(r))
      ]));
    });
    return ul;
  }

  function materialsBlock(tags, heading, sub) {
    var books = pick("book", tags, 3);
    var podcasts = pick("podcast", tags, 3);
    var other = pick("article", tags, 2).concat(pick("tool", tags, 3)).slice(0, 4);
    if (!books.length && !podcasts.length && !other.length) return null;

    matCounter += 1;
    var headId = "mat-title-" + matCounter;
    var box = el("section", { class: "materials", "aria-labelledby": headId });
    box.appendChild(el("h2", { id: headId, text: heading }));
    if (sub) box.appendChild(el("p", { class: "sub", text: sub }));
    if (books.length) { box.appendChild(el("h3", { class: "group-title", text: t("gBooks") })); box.appendChild(resourceList(books)); }
    if (podcasts.length) { box.appendChild(el("h3", { class: "group-title", text: t("gPodcasts") })); box.appendChild(resourceList(podcasts)); }
    if (other.length) { box.appendChild(el("h3", { class: "group-title", text: t("gOther") })); box.appendChild(resourceList(other)); }
    return box;
  }

  /* ---------- Результат агента ---------- */

  function siteUrl() {
    return /^https?:$/.test(location.protocol) ? location.origin : "";
  }

  function madeBadge() {
    var url = siteUrl();
    var host = url ? url.replace(/^https?:\/\//, "") : "razbor";
    var link = el("a", { class: "made", href: url ? url + "/" : "#", target: "_blank", rel: "noopener", "aria-label": t("madeAria") }, [
      el("img", { src: "mark.png", alt: "", width: "30", height: "30" }),

        el("span", { class: "made-url", text: host })
      ])

    return el("div", { class: "made-row" }, [link]);
  }

  function noticeBlock() {
    return el("p", { class: "notice" }, [el("strong", { text: t("noticeTitle") }), document.createTextNode(t("noticeText"))]);
  }

  function section(title, content) {
    return el("div", null, [el("h3", { text: title }), content]);
  }

  function resultToText(res) {
    var lines = [res.title, "", t("noticeTitle") + t("noticeText"), "", res.pitch, "", t("forWhom") + res.audience, t("pain") + res.pain, t("how") + res.how_it_works,
      t("earn") + res.money];
    if (res.cost) lines.push(t("sCost") + ": " + res.cost);
    lines.push(t("similar") + res.competitors);
    if (res.validate && res.validate.length) {
      lines.push("", t("sValidate") + ":");
      res.validate.forEach(function (v, i) { lines.push((i + 1) + ". " + v); });
    }
    lines.push("", t("riskHead"));
    res.risks.forEach(function (r) { lines.push("- " + r); });
    lines.push("", t("improveHead") + res.improve);
    var plan = (res.week_plan && res.week_plan.length) ? res.week_plan : res.steps;
    lines.push("", (res.week_plan && res.week_plan.length ? t("sWeek") : t("stepsHead")) + ":");
    plan.forEach(function (s, i) { lines.push((i + 1) + ". " + s); });
    if (res.to_check && res.to_check.length) {
      lines.push("", t("sCheck") + ":");
      res.to_check.forEach(function (c) { lines.push("- " + c); });
    }
    lines.push("", t("scoreLine") + t("demandWord") + " " + res.scores.demand + "/5, " + t("easeWord") + " " + res.scores.ease + "/5, " + t("spaceWord") + " " + res.scores.space + "/5",
      t("verdictLine") + res.verdict, "", "made with razbor." + (siteUrl() ? " " + siteUrl() + "/" : ""));
    return lines.join("\n");
  }

  function copyText(text, done) {
    function fallback() {
      var ta = document.createElement("textarea");
      ta.value = text; ta.setAttribute("readonly", "");
      ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      var ok = false;
      try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
      document.body.removeChild(ta);
      done(ok);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { done(true); }, fallback);
    } else { fallback(); }
  }

  function renderResult(res, scroll) {
    var box = $("result");
    box.textContent = "";
    box.hidden = false;

    if (res.refusal) {
      box.appendChild(el("div", { class: "refusal" }, [el("p", { text: res.refusal })]));
      if (scroll) box.scrollIntoView({ behavior: "smooth", block: "start" });
      return;
    }

    var risks = el("ul");
    res.risks.forEach(function (r) { risks.appendChild(el("li", { text: r })); });
    var validateBlock = null;
    if (res.validate && res.validate.length) {
      var vol = el("ol");
      res.validate.forEach(function (v) { vol.appendChild(el("li", { text: v })); });
      validateBlock = section(t("sValidate"), vol);
    }
    var checkBlock = null;
    if (res.to_check && res.to_check.length) {
      var cul = el("ul");
      res.to_check.forEach(function (c) { cul.appendChild(el("li", { text: c })); });
      checkBlock = el("div", { class: "check" }, [el("h3", { text: t("sCheck") }), cul]);
    }
    var planItems = (res.week_plan && res.week_plan.length) ? res.week_plan : (res.steps || []);
    var hasWeek = !!(res.week_plan && res.week_plan.length);
    var steps = el("ol");
    planItems.forEach(function (s) { steps.appendChild(el("li", { text: s })); });

    var copyStatus = el("span", { class: "counter", role: "status" });
    var copyBtn = el("button", { class: "btn ghost", type: "button", text: t("copyBtn") });
    copyBtn.addEventListener("click", function () {
      copyText(resultToText(res), function (ok) { copyStatus.textContent = ok ? t("copied") : t("copyFail"); });
    });

    var actions = el("div", { class: "result-actions" }, [copyBtn]);
    if (res.__mode === "generate") {
      var again = el("button", { class: "btn ghost", type: "button", text: t("again") });
      again.addEventListener("click", function () { mode = "generate"; send(); });
      actions.appendChild(again);
    }
    actions.appendChild(copyStatus);

    var card = el("div", { class: "result-card" }, [
      el("h2", { class: "result-title", text: res.title }),
      el("p", { class: "pitch", text: res.pitch }),
      el("p", { class: "verdict", text: res.verdict }),
      noticeBlock(),
      scoresBlock(res.scores),
      el("p", { class: "ai-cap", text: t("aiCap") }),
      el("div", { class: "sections" }, [
        section(t("sPeople"), el("p", { text: res.audience })),
        section(t("sPain"), el("p", { text: res.pain })),
        section(t("sHow"), el("p", { text: res.how_it_works })),
        section(t("sMoney"), el("p", { text: res.money })),
        res.cost ? section(t("sCost"), el("p", { text: res.cost })) : null,
        section(t("sComp"), el("p", { text: res.competitors })),
        validateBlock,
        el("div", { class: "risk" }, [el("h3", { text: t("sRisks") }), risks]),
        section(t("sImprove"), el("p", { text: res.improve })),
        section(hasWeek ? t("sWeek") : t("sSteps"), steps),
        checkBlock
      ]),
      actions,
      madeBadge()
    ]);
    box.appendChild(card);

    var mat = materialsBlock(res.tags || [], t("matIdea"), t("matIdeaSub"));
    if (mat) box.appendChild(mat);

    if (scroll) box.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  /* ---------- Запрос к агенту ---------- */

  function setStatus(text, isError) {
    var s = $("agent-status");
    s.textContent = text || "";
    s.className = "status" + (isError ? " error" : "");
  }

  async function send() {
    if (busy) return;
    var text = $("agent-input").value.trim();
    if (mode === "analyze" && text.length < 15) {
      setStatus(t("tooShort"), true);
      $("agent-input").focus();
      return;
    }
    busy = true;
    $("agent-send").disabled = true;
    var sendMode = mode;
    var sendLang = LANG;
    setStatus(sendMode === "generate" ? t("statusGen") : t("statusAn"), false);

    var controller = new AbortController();
    var timer = setTimeout(function () { controller.abort(); }, 40000);
    try {
      var response = await fetch("/api/agent", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ mode: sendMode, text: text, lang: sendLang }),
        signal: controller.signal
      });
      var data = null;
      try { data = await response.json(); } catch (e) { data = null; }
      if (!response.ok || !data || !data.result) {
        throw new Error((data && data.error) || t("failed"));
      }
      setStatus("", false);
      data.result.__mode = sendMode;
      lastResult = data.result;
      lastResultLang = sendLang;
      renderResult(lastResult, true);
    } catch (err) {
      var msg = err && err.name === "AbortError" ? t("slow") : (err && err.message) || t("failed");
      setStatus(msg, true);
    } finally {
      clearTimeout(timer);
      busy = false;
      $("agent-send").disabled = false;
    }
  }

  function applyMode(next) {
    mode = next;
    var prefix = mode === "generate" ? "generate" : "analyze";
    Array.prototype.forEach.call(document.querySelectorAll(".mode"), function (b) {
      b.setAttribute("aria-pressed", b.getAttribute("data-mode") === mode ? "true" : "false");
    });
    $("agent-label").textContent = t(prefix + "Label");
    $("agent-input").setAttribute("placeholder", t(prefix + "Ph"));
    $("agent-send").textContent = t(prefix + "Btn");

    var ex = $("examples");
    ex.textContent = "";
    t(prefix + "Ex").forEach(function (txt) {
      var b = el("button", { class: "example", type: "button", text: txt });
      b.addEventListener("click", function () {
        $("agent-input").value = txt;
        updateCounter();
        $("agent-input").focus();
      });
      ex.appendChild(b);
    });
    setStatus("", false);
  }

  function updateCounter() {
    $("counter").textContent = $("agent-input").value.length + " / 1200";
  }

  Array.prototype.forEach.call(document.querySelectorAll(".mode"), function (b) {
    b.addEventListener("click", function () { applyMode(b.getAttribute("data-mode")); });
  });
  $("agent-input").addEventListener("input", updateCounter);
  $("agent-input").addEventListener("keydown", function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); send(); }
  });
  $("agent-send").addEventListener("click", send);

  function topics() { return LANG === "en" && EN_TOPICS.length ? EN_TOPICS : RU_TOPICS; }

  function renderIdea(idea, open) {

      el("h3", { text: idea.title }),

      el("span", { class: "toggle" }, [el("span", { class: "t-open", text: t("openIdea") }), el("span", { class: "t-close", text: t("closeIdea") })])
    ]);
    var planList = idea.week || idea.steps || [];
    var steps = el("ol");
    planList.forEach(function (s) { steps.appendChild(el("li", { text: s })); });
    var validate = null;
    if (idea.validate && idea.validate.length) {
      validate = el("ol");
      idea.validate.forEach(function (v) { validate.appendChild(el("li", { text: v })); });
    }
    var check = null;
    if (idea.to_check && idea.to_check.length) {
      check = el("ul");
      idea.to_check.forEach(function (c) { check.appendChild(el("li", { text: c })); });
    }
    var body = el("div", { class: "idea-body" }, [
      idea.week ? noticeBlock() : null,
      el("div", null, [el("h4", { text: t("what") }), el("p", { text: idea.what })]),
      el("div", null, [el("h4", { text: t("money") }), el("p", { text: idea.money })]),
      idea.cost ? el("div", null, [el("h4", { text: t("sCost") }), el("p", { text: idea.cost })]) : null,
      validate ? el("div", null, [el("h4", { text: t("sValidate") }), validate]) : null,
      el("div", { class: "risk" }, [el("h4", { text: t("risks") }), el("p", { text: idea.risks })]),
      el("div", null, [el("h4", { text: idea.week ? t("sWeek") : t("steps") }), steps]),
      check ? el("div", { class: "check" }, [el("h4", { text: t("sCheck") }), check]) : null,
      madeBadge()
    ]);
    var d = el("details", { class: "idea" }, [summary, body]);
    if (open) d.setAttribute("open", "");
    return d;
  }

  function renderChips() {
    var box = $("chips");
    box.textContent = "";
    topics().forEach(function (tp) {
      var b = el("button", { class: "chip", type: "button", "data-id": tp.id, "aria-pressed": "false", text: tp.name });
      b.addEventListener("click", function () { renderTopic(tp.id); });
      box.appendChild(b);
    });
  }

  function renderTopic(id) {
    var topic = null;
    topics().forEach(function (tp) { if (tp.id === id) topic = tp; });
    if (!topic) return;
    currentTopic = id;
    Array.prototype.forEach.call($("chips").children, function (b) {
      b.setAttribute("aria-pressed", b.getAttribute("data-id") === id ? "true" : "false");
    });
    var body = $("library-body");
    body.textContent = "";
    body.appendChild(el("p", { class: "topic-intro", text: topic.intro }));
    body.appendChild(el("p", { class: "legend", text: t("legend") }));
    topic.ideas.forEach(function (idea) { body.appendChild(renderIdea(idea, false)); });
    var mat = materialsBlock([topic.id], t("matTopic"), null);
    if (mat) body.appendChild(mat);
  }

  /* ---------- Пример, методика, первый экран ---------- */

  function renderSample() {
    var src = LANG === "en" && window.SITE_EN && window.SITE_EN.sample ? window.SITE_EN.sample : (window.SITE && window.SITE.sample);
    var body = $("sample-body");
    body.textContent = "";
    if (!src) { $("sample").hidden = true; return; }
    $("sample").hidden = false;
    body.appendChild(el("span", { class: "tag-sample", text: t("sampleTag") }));
    var d = renderIdea(src, true);
    d.id = "sample-idea";
    body.appendChild(d);
  }

  function renderMethod() {
    var body = $("method-body");
    body.textContent = "";
    function list(items) {
      var ul = el("ul");
      items.forEach(function (x) { ul.appendChild(el("li", { text: x })); });
      return ul;
    }
    body.appendChild(el("h3", { text: t("methScores") }));
    body.appendChild(list(t("methScoresList")));
    body.appendChild(el("h3", { text: t("methLimits") }));
    body.appendChild(list(t("methLimitsList")));
    body.appendChild(el("h3", { text: t("methVerify") }));
    body.appendChild(el("p", { text: t("methVerifyText") }));
  }

  function renderAud() {
    var ul = $("aud");
    ul.textContent = "";
    t("aud").forEach(function (x) { ul.appendChild(el("li", { text: x })); });
  }

  function goAgent() {
    var a = $("agent");
    a.scrollIntoView({ behavior: "smooth", block: "start" });
    applyMode("analyze");
    $("agent-input").focus({ preventScroll: true });
  }
  $("hero-cta").addEventListener("click", goAgent);
  $("sample-cta").addEventListener("click", goAgent);

  /* ---------- Язык ---------- */

  function applyLang() {
    document.documentElement.lang = LANG;
    document.title = t("docTitle");
    Array.prototype.forEach.call(document.querySelectorAll("[data-i18n]"), function (n) {
      n.textContent = t(n.getAttribute("data-i18n"));
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-i18n-aria]"), function (n) {
      n.setAttribute("aria-label", t(n.getAttribute("data-i18n-aria")));
    });
    document.querySelector('.mode[data-mode="generate"]').textContent = t("modeGenerate");
    document.querySelector('.mode[data-mode="analyze"]').textContent = t("modeAnalyze");
    Array.prototype.forEach.call(document.querySelectorAll(".lang button"), function (b) {
      b.setAttribute("aria-pressed", b.getAttribute("data-lang") === LANG ? "true" : "false");
    });
    applyMode(mode);
    renderAud();
    renderSample();
    renderMethod();
    renderChips();
    var list = topics();
    var keep = currentTopic;
    var found = false;
    list.forEach(function (tp) { if (tp.id === keep) found = true; });
    if (list.length) renderTopic(found ? keep : list[0].id);
    if (lastResult) renderResult(lastResult, false);
    updateCounter();
  }

  Array.prototype.forEach.call(document.querySelectorAll(".lang button"), function (b) {
    b.addEventListener("click", function () {
      var next = b.getAttribute("data-lang");
      if (next === LANG) return;
      LANG = next;
      try { localStorage.setItem("lang", LANG); } catch (e) { /* хранилище недоступно */ }
      applyLang();
    });
  });

  applyLang();
})();
</script>
</body>
</html>
