<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>razbor — Idea starts here.</title>
<meta name="description" content="Узнай за 2 минуты, стоит ли запускать твою идею: оценка спроса и конкуренции, затраты на старт, проверка спроса до вложений, риски и план на 7 дней. Оценка ИИ, не данные рынка.">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#F6F8FC">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Golos+Text:wght@400;500;600&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F6F8FC;
    --surface: #FFFFFF;
    --grid: rgba(43, 75, 219, 0.10);
    --ink: #16213E;
    --muted: #56617F;
    --line: #C3CCE2;
    --pen: #2B4BDB;
    --marker: #FFE14D;
    --red: #C8372B;

    --font-display: "Unbounded", "Arial Black", system-ui, sans-serif;
    --font-body: "Golos Text", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --font-hand: "Caveat", "Segoe Print", "Bradley Hand", cursive;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #0E1630;
      --surface: #152042;
      --grid: rgba(140, 165, 255, 0.10);
      --ink: #E9EDFA;
      --muted: #9AA6C8;
      --line: #2C3860;
      --pen: #9DB0FF;
      --red: #FF8E81;
    }
  }

  *, *::before, *::after { box-sizing: border-box; }

  body {
    margin: 0;
    background-color: var(--paper);
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 28px 28px;
    color: var(--ink);
    font: 400 1.0625rem/1.6 var(--font-body);
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: 880px; margin: 0 auto; padding: 0 20px; }
  .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  :focus-visible { outline: 3px solid var(--pen); outline-offset: 3px; }

  /* Шапка */
  .top { padding: 22px 0 0; display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  .logo-link { display: inline-block; line-height: 0; border-radius: 6px; }
  .logo { display: block; height: 56px; width: auto; }
  @media (prefers-color-scheme: dark) {
    .logo-link { background: #F6F8FC; padding: 4px 10px; }
  }

  /* Бейдж «made with razbor.» */
  .made-row { display: flex; justify-content: flex-end; margin: 22px 0 0; }
  .idea-body .made-row { margin: 8px 0 0; }
  .made {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 6px 16px 6px 8px;
    background: var(--marker);
    color: #16213E;
    border: 2px solid #16213E;
    border-radius: 999px;
    box-shadow: 3px 3px 0 #16213E;
    text-decoration: none;
    transform: rotate(-1.2deg);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .made:hover, .made:focus-visible { transform: rotate(0deg) translateY(-1px); box-shadow: 4px 4px 0 #16213E; }
  .made img { display: block; width: 30px; height: 30px; object-fit: contain; background: #F6F8FC; border-radius: 50%; padding: 3px; }
  .made-text { display: flex; flex-direction: column; line-height: 1.15; }
  .made-main { font: 500 0.95rem var(--font-body); }
  .made-main strong { font: 700 1.02rem var(--font-display); letter-spacing: -0.01em; }
  .made-url { font: 500 0.74rem var(--font-body); opacity: 0.8; }

  .lang { margin-left: auto; display: flex; gap: 6px; }
  .lang button {
    font: 600 0.85rem var(--font-body);
    padding: 0.3rem 0.7rem;
    border: 2px solid var(--ink);
    border-radius: 6px;
    background: var(--surface);
    color: var(--ink);
    cursor: pointer;
  }
  .lang button:hover { background: var(--marker); color: #16213E; }
  .lang button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }

  /* Первый экран */
  .hero { padding: 40px 0 22px; }
  h1 {
    margin: 0 0 14px;
    font: 700 clamp(1.7rem, 5vw, 2.8rem)/1.12 var(--font-display);
    letter-spacing: -0.02em;
  }
  .lead { margin: 0; max-width: 60ch; color: var(--muted); }

  /* Агент */
  .agent { background: var(--surface); border: 2px solid var(--ink); border-radius: 6px; padding: 22px; }
  .modes { display: flex; flex-wrap: wrap; gap: 10px; margin: 0 0 18px; }
  .mode, .chip {
    font: 600 0.95rem var(--font-body);
    padding: 0.55rem 1rem;
    border: 2px solid var(--ink);
    border-radius: 6px;
    background: var(--surface);
    color: var(--ink);
    cursor: pointer;
  }
  .mode:hover, .chip:hover { background: var(--marker); color: #16213E; }
  .mode[aria-pressed="true"], .chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); }

  .agent label { display: block; font-weight: 600; margin: 0 0 6px; }
  .agent textarea {
    width: 100%;
    min-height: 120px;
    padding: 12px;
    font: 400 1rem/1.5 var(--font-body);
    color: var(--ink);
    background: var(--paper);
    border: 2px solid var(--ink);
    border-radius: 6px;
    resize: vertical;
  }
  .examples { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 0; }
  .example {
    font: 400 0.88rem var(--font-body);
    padding: 0.3rem 0.7rem;
    border: 1px dashed var(--muted);
    border-radius: 6px;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
  }
  .example:hover { color: var(--ink); border-color: var(--ink); border-style: solid; }

  .actions { display: flex; align-items: center; flex-wrap: wrap; gap: 14px; margin: 16px 0 0; }
  .btn {
    font: 600 1rem var(--font-body);
    padding: 0.7rem 1.3rem;
    background: var(--ink);
    color: var(--paper);
    border: 2px solid var(--ink);
    border-radius: 6px;
    cursor: pointer;
  }
  .btn:hover:not(:disabled) { background: var(--marker); color: #16213E; }
  .btn:disabled { opacity: 0.6; cursor: progress; }
  .btn.ghost { background: transparent; color: var(--ink); }
  .counter { color: var(--muted); font-size: 0.85rem; }
  .status { margin: 12px 0 0; min-height: 1.5em; font-size: 0.95rem; color: var(--muted); }
  .status.error { color: var(--red); font-weight: 500; }
  .hint { margin: 6px 0 0; font-size: 0.82rem; color: var(--muted); }

  /* Результат */
  .result { margin: 28px 0 0; }
  .result-card { background: var(--surface); border: 2px solid var(--ink); border-radius: 6px; padding: 22px; }
  .result h2.result-title { margin: 0 0 8px; font: 700 clamp(1.3rem, 3.4vw, 1.8rem)/1.2 var(--font-display); letter-spacing: -0.01em; }
  .pitch { margin: 0 0 8px; max-width: 62ch; font-size: 1.1rem; }
  .verdict { margin: 4px 0 14px; font: 600 1.6rem/1.15 var(--font-hand); color: var(--pen); transform: rotate(-0.7deg); transform-origin: left center; display: inline-block; }
  .scores { margin: 0 0 6px; display: grid; gap: 4px; font-size: 0.85rem; max-width: 260px; }
  .score { display: grid; grid-template-columns: 4.2rem auto; align-items: center; gap: 8px; }
  .score dt { color: var(--muted); }
  .score dd { margin: 0; display: flex; gap: 3px; }
  .dot { width: 10px; height: 10px; border: 2px solid var(--ink); border-radius: 50%; }
  .dot.on { background: var(--ink); }

  .sections { display: grid; gap: 4px; margin: 16px 0 0; border-top: 1px dashed var(--line); }
  .sections h3 { margin: 16px 0 2px; font: 600 0.95rem var(--font-body); color: var(--muted); }
  .sections p { margin: 0; max-width: 64ch; }
  .sections ul, .sections ol { margin: 0; padding-left: 1.3rem; max-width: 64ch; }
  .sections li { margin: 0 0 4px; }
  .risk { border-left: 4px solid var(--red); padding-left: 12px; margin-top: 12px; }
  .refusal { background: var(--surface); border: 2px solid var(--ink); border-left-width: 8px; border-radius: 6px; padding: 16px 18px; }
  .refusal p { margin: 0; }

  .result-actions { display: flex; flex-wrap: wrap; gap: 10px; margin: 20px 0 0; }

  /* Материалы */
  .materials { margin: 28px 0 0; }
  .materials h2, .library h2 { margin: 0 0 6px; font: 700 clamp(1.3rem, 3.4vw, 1.7rem)/1.2 var(--font-display); letter-spacing: -0.01em; }
  .materials .sub { margin: 0 0 14px; color: var(--muted); max-width: 62ch; }
  .group-title { margin: 22px 0 4px; font: 600 1rem var(--font-body); }
  .res { list-style: none; margin: 0; padding: 0; }
  .res li { padding: 14px 0; border-top: 1px dashed var(--line); max-width: 72ch; }
  .res li:last-child { border-bottom: 1px dashed var(--line); }
  .res-title { font-weight: 600; }
  .res-meta { color: var(--muted); font-size: 0.92rem; }
  .res-note { margin: 2px 0 8px; }
  .links { display: flex; flex-wrap: wrap; gap: 8px; }
  .link {
    display: inline-block;
    font: 600 0.88rem var(--font-body);
    padding: 0.35rem 0.8rem;
    border: 2px solid var(--ink);
    border-radius: 6px;
    color: var(--ink);
    text-decoration: none;
    background: var(--surface);
  }
  .link:hover { background: var(--marker); color: #16213E; }
  .link.secondary { border-style: dashed; border-color: var(--muted); color: var(--muted); font-weight: 500; }
  .link.secondary:hover { border-style: solid; border-color: var(--ink); color: #16213E; }

  /* Готовые разборы */
  .library { margin: 48px 0 0; padding: 28px 0 0; border-top: 2px solid var(--ink); }
  .library .sub { margin: 0 0 14px; color: var(--muted); max-width: 62ch; }
  .chips { display: flex; flex-wrap: wrap; gap: 10px; margin: 0 0 22px; }
  .topic-intro { margin: 0 0 14px; max-width: 62ch; }
  .legend { margin: 0 0 14px; font-size: 0.88rem; color: var(--muted); max-width: 70ch; }

  .idea { border: 2px solid var(--ink); background: var(--surface); margin: 0 0 14px; border-radius: 6px; }
  .idea summary { list-style: none; cursor: pointer; padding: 16px 18px; display: grid; grid-template-columns: 1fr auto; gap: 6px 20px; align-items: start; }
  .idea summary::-webkit-details-marker { display: none; }
  .idea h3 { margin: 0; font: 500 1.02rem/1.35 var(--font-display); }
  .idea .verdict { grid-column: 1; margin: 0; font-size: 1.5rem; }
  .idea .scores { grid-column: 2; grid-row: 1 / span 2; margin: 0; max-width: none; }
  .toggle { grid-column: 1; font-size: 0.85rem; color: var(--muted); }
  .toggle::before { content: "+ "; font-weight: 600; }
  .idea[open] .toggle::before { content: "\2212  "; }
  .idea[open] .toggle .t-open { display: none; }
  .idea:not([open]) .toggle .t-close { display: none; }
  .idea-body { padding: 4px 18px 18px; border-top: 1px dashed var(--line); display: grid; gap: 14px; }
  .idea-body h4 { margin: 14px 0 2px; font: 600 0.95rem var(--font-body); color: var(--muted); }
  .idea-body p { margin: 0; max-width: 64ch; }
  .idea-body ol { margin: 0; padding-left: 1.3rem; max-width: 64ch; }
  .idea-body li { margin: 0 0 4px; }

  /* Первый экран: аудитория, пример, методика */
  .aud { list-style: none; margin: 16px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }
  .aud li { font: 500 0.88rem var(--font-body); padding: 0.3rem 0.8rem; border: 2px solid var(--ink); border-radius: 999px; background: var(--surface); }
  .hero-cta { margin: 20px 0 0; display: flex; flex-wrap: wrap; align-items: center; gap: 14px; }
  .hero-cta .note { color: var(--muted); font-size: 0.88rem; }
  .sample { margin: 28px 0 0; }
  .sample h2, .method h2 { margin: 0 0 6px; font: 700 clamp(1.3rem, 3.4vw, 1.7rem)/1.2 var(--font-display); letter-spacing: -0.01em; }
  .sample .sub { margin: 0 0 14px; color: var(--muted); max-width: 62ch; }
  .tag-sample { display: inline-block; margin: 0 0 8px; padding: 0.15rem 0.6rem; background: var(--marker); color: #16213E; border: 2px solid #16213E; border-radius: 6px; font: 600 0.8rem var(--font-body); }
  .sample .cta-row { margin: 14px 0 0; }
  .notice { margin: 0 0 14px; padding: 10px 14px; border: 2px dashed var(--muted); border-radius: 6px; font-size: 0.9rem; color: var(--muted); max-width: 70ch; }
  .notice strong { color: var(--ink); }
  .ai-cap { margin: 0 0 6px; font-size: 0.8rem; color: var(--muted); }
  .check { border-left: 4px solid var(--pen); padding-left: 12px; margin-top: 12px; }
  .method { margin: 40px 0 0; padding: 24px 0 0; border-top: 2px solid var(--ink); }
  .method p, .method li { max-width: 68ch; }
  .method ul { margin: 0 0 12px; padding-left: 1.3rem; }
  .method h3 { margin: 16px 0 4px; font: 600 1rem var(--font-body); }

  /* Проекты и Reality Check */
  .workspace { margin: 40px 0 0; padding: 24px 0 0; border-top: 2px solid var(--ink); }
  .workspace > h2, .public-report h2.big { margin: 0 0 6px; font: 700 clamp(1.3rem, 3.4vw, 1.7rem)/1.2 var(--font-display); letter-spacing: -0.01em; }
  .workspace .sub { margin: 0 0 16px; color: var(--muted); max-width: 64ch; }
  .public-report { margin: 24px 0 0; }
  a.btn { display: inline-block; text-decoration: none; }
  .btn.small { padding: 0.35rem 0.8rem; font-size: 0.88rem; }
  .muted { color: var(--muted); font-size: 0.9rem; margin: 2px 0 6px; }
  .err { color: var(--red); font-weight: 500; }
  .pcard { background: var(--surface); border: 2px solid var(--ink); border-radius: 6px; padding: 16px 18px; margin: 0 0 14px; }
  .pcard.primary { border-left-width: 8px; border-left-color: var(--pen); }
  .pcard.row { display: grid; grid-template-columns: 1fr auto; gap: 8px 16px; align-items: center; }
  .pcard.row .result-actions { grid-column: 1 / -1; margin: 0; }
  .pcard summary { cursor: pointer; font-weight: 600; }
  .ph { margin: 0 0 6px; font: 600 1.05rem/1.3 var(--font-body); }
  h2.ph.big { font: 700 clamp(1.3rem, 3.4vw, 1.7rem)/1.2 var(--font-display); margin: 14px 0 12px; }
  .pr-title { margin: 0 0 6px; font-weight: 600; }
  .pblock h4, .pcard h4, .scorebox h4 { margin: 14px 0 4px; font: 600 0.92rem var(--font-body); color: var(--muted); }
  .pblock p { margin: 0 0 8px; max-width: 64ch; }
  .pcard ul, .pcard ol { margin: 0 0 8px; padding-left: 1.3rem; max-width: 66ch; }
  .pcard ul.plain { list-style: none; padding: 0; }
  .pchip { display: inline-block; padding: 0.15rem 0.6rem; border: 2px solid var(--ink); border-radius: 999px; font: 600 0.78rem var(--font-body); margin: 0 6px 6px 0; background: var(--surface); }
  .pchip.badge { background: var(--marker); color: #16213E; border-color: #16213E; border-radius: 6px; }
  .pchip.lab-unvalidated, .pchip.st-untested { border-style: dashed; color: var(--muted); }
  .pchip.lab-stronger, .pchip.st-supported { background: var(--ink); color: var(--paper); }
  .pchip.st-rejected { border-color: var(--red); color: var(--red); }
  .pchip.st-testing, .pchip.est-active { background: var(--marker); color: #16213E; border-color: #16213E; }
  .plist { list-style: none; padding: 0; }
  .plist li { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; padding: 8px 0; border-top: 1px dashed var(--line); }
  .scorebox { background: var(--surface); border: 2px solid var(--ink); border-radius: 6px; padding: 16px 18px; margin: 0 0 14px; }
  .scorehead { display: flex; align-items: center; gap: 16px; }
  .bignum { font: 700 3rem/1 var(--font-body); font-variant-numeric: lining-nums; }
  .outof { color: var(--muted); font-size: 0.85rem; margin: 0 0 4px; }
  .scoretext { margin: 8px 0 4px; font-weight: 500; }
  .scorenote { margin: 0 0 10px; color: var(--muted); font-size: 0.88rem; max-width: 64ch; }
  .bars { display: grid; gap: 6px; max-width: 520px; }
  .bar { display: grid; grid-template-columns: 1fr 90px 3rem; gap: 10px; align-items: center; font-size: 0.85rem; }
  .bar-t { height: 8px; border: 1px solid var(--ink); border-radius: 4px; overflow: hidden; display: block; }
  .bar-f { display: block; height: 100%; background: var(--pen); }
  .bar-v { text-align: right; color: var(--muted); }
  .empty { border: 2px dashed var(--muted); border-radius: 6px; padding: 16px 18px; margin: 0 0 14px; }
  .empty p { margin: 0 0 12px; max-width: 62ch; }
  .loading { border: 2px dashed var(--muted); border-radius: 6px; padding: 16px 18px; margin: 0 0 14px; }
  .skel { height: 12px; margin: 10px 0; background: var(--line); border-radius: 4px; animation: pulse 1.4s ease-in-out infinite; }
  .skel.s2 { width: 80%; } .skel.s3 { width: 55%; }
  @keyframes pulse { 50% { opacity: 0.4; } }
  .ptabs { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 16px; }
  .ptab { font: 600 0.88rem var(--font-body); padding: 0.4rem 0.8rem; border: 2px solid var(--ink); border-radius: 6px; background: var(--surface); color: var(--ink); cursor: pointer; }
  .ptab:hover { background: var(--marker); color: #16213E; }
  .ptab[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  .exp-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 6px 12px; }
  .steps { list-style: none; padding: 0 !important; }
  .steps li { margin: 0 0 6px; }
  .meta { margin: 8px 0; display: grid; gap: 8px; }
  .meta dt { font-weight: 600; font-size: 0.88rem; color: var(--muted); }
  .meta dd { margin: 0; max-width: 64ch; }
  .mgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; margin: 8px 0 12px; }
  .frow { display: grid; gap: 4px; font-size: 0.88rem; font-weight: 600; margin: 8px 0; }
  .workspace input[type="text"], .workspace input[type="url"], .workspace input[type="number"], .workspace select, .workspace textarea {
    width: 100%; padding: 8px 10px; font: 400 1rem var(--font-body); color: var(--ink); background: var(--paper); border: 2px solid var(--ink); border-radius: 6px;
  }
  .workspace textarea { margin: 0 0 8px; }
  .workspace input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--pen); vertical-align: middle; }
  .consent { display: block; margin: 10px 0; font-size: 0.92rem; }
  .oc-supported { border-left: 8px solid var(--pen); }
  .oc-rejected { border-left: 8px solid var(--red); }
  .oc-inconclusive, .oc-contradictory { border-left: 8px dashed var(--muted); }
  .timeline { list-style: none; padding: 0 !important; }
  .timeline li { padding: 8px 0; border-top: 1px dashed var(--line); }
  .preview { margin: 12px 0; }
  .preview canvas { width: 100%; max-width: 600px; height: auto; border: 2px solid var(--ink); border-radius: 6px; display: block; }
  .share-out { margin-top: 8px; }
  .public-report .pcard .verdict { display: block; }
  @media (max-width: 560px) { .pcard.row { grid-template-columns: 1fr; } .bar { grid-template-columns: 1fr 70px 3rem; } }
  @media (prefers-reduced-motion: reduce) { .skel { animation: none; } }

  /* Меню и вкладки */
  .nav { position: sticky; top: 0; z-index: 10; display: flex; gap: 8px; overflow-x: auto; padding: 10px 20px; margin: 14px -20px 0; background: var(--paper); border-bottom: 2px solid var(--ink); scrollbar-width: none; }
  .nav::-webkit-scrollbar { display: none; }
  .nav-b { flex: none; font: 600 0.92rem var(--font-body); padding: 0.45rem 0.9rem; border: 2px solid var(--ink); border-radius: 6px; background: var(--surface); color: var(--ink); cursor: pointer; white-space: nowrap; }
  .nav-b:hover { background: var(--marker); color: #16213E; }
  .nav-b[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  .view[hidden] { display: none; }
  .hero { padding: 26px 0 16px; }
  .linkbtn { background: none; border: 0; padding: 0; font: 500 0.92rem var(--font-body); color: var(--pen); text-decoration: underline; cursor: pointer; }
  .gtabs { display: flex; flex-wrap: wrap; gap: 6px; margin: 14px 0 0; padding-top: 14px; border-top: 1px dashed var(--line); }
  .gtab { font: 600 0.88rem var(--font-body); padding: 0.35rem 0.8rem; border: 2px solid var(--ink); border-radius: 6px; background: var(--surface); color: var(--ink); cursor: pointer; }
  .gtab:hover { background: var(--marker); color: #16213E; }
  .gtab[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  .gpane { margin-top: 4px; }
  .gpane[hidden] { display: none; }
  .gpane h3 { margin: 14px 0 2px; font: 600 0.95rem var(--font-body); color: var(--muted); }
  .gpane p { margin: 0; max-width: 64ch; }
  .gpane ul, .gpane ol { margin: 0; padding-left: 1.3rem; max-width: 64ch; }
  .gpane .materials { margin-top: 10px; }
  .gpane .materials h2 { font-size: 1.05rem; }
  .ai-cap { margin: 4px 0 0; }

      else a(t("findYandexPod"), "https://www.google.com/search?q=" + q(search + " podcast"), true);
    } else if (!r.url) {
      if (LANG === "ru") a(t("findYandex"), "https://yandex.ru/search/?text=" + q(search), false);
      else a(t("findGoogle"), "https://www.google.com/search?q=" + q(v.title + " " + v.by), false);
    }
    return out;
  }

  function relevance(r, tags) {
    var s = 0;
    r.tags.forEach(function (tg) { if (tags.indexOf(tg) !== -1) s += 1; });
    if (s > 0 && r.lang === LANG) s += 0.5;
    return s;
  }

  function pick(type, tags, limit) {
    return resources
      .filter(function (r) { return r.type === type; })
      .map(function (r) { return { r: r, s: relevance(r, tags) }; })
      .filter(function (x) { return x.s > 0; })
      .sort(function (a, b) { return b.s - a.s; })
      .slice(0, limit)
      .map(function (x) { return x.r; });
  }

        el("p", { class: "res-note", text: v.note }),
        el("div", { class: "links" }, linksFor(r))
      ]));
    });
    return ul;
  }

    if (other.length) { box.appendChild(el("h3", { class: "group-title", text: t("gOther") })); box.appendChild(resourceList(other)); }

  function copyText(text, done) {
    function fallback() {
      var ta = document.createElement("textarea");
      ta.value = text; ta.setAttribute("readonly", "");
      ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      var ok = false;
      try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
      document.body.removeChild(ta);
      done(ok);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { done(true); }, fallback);
    } else { fallback(); }
  }

  /* ---------- Запрос к агенту ---------- */

  function setStatus(text, isError) {
    var s = $("agent-status");
    s.textContent = text || "";
    s.className = "status" + (isError ? " error" : "");
  }

  var lastCall = 0;
  var COOLDOWN_MS = 3000;
  var DAILY_SOFT = 40;

  function dailyCount() {
    try {
      var d = JSON.parse(localStorage.getItem("razbor.daily") || "{}");
      var today = new Date().toISOString().slice(0, 10);
      return d.day === today ? (d.n || 0) : 0;
    } catch (e) { return 0; }
  }
  function bumpDaily() {
    try {
      var today = new Date().toISOString().slice(0, 10);
      localStorage.setItem("razbor.daily", JSON.stringify({ day: today, n: dailyCount() + 1 }));
    } catch (e) { /* хранилище недоступно */ }
  }

  /* Общий запрос к агенту. Возвращает { ok, result } или { ok:false, error }. Ввод пользователя не трогает. */
  async function api(payload) {
    var nowMs = Date.now();
    if (nowMs - lastCall < COOLDOWN_MS) return { ok: false, error: t("cooldown") };
    if (dailyCount() >= DAILY_SOFT) return { ok: false, error: t("dailyLimit") };
    lastCall = nowMs;
    bumpDaily();
    var controller = new AbortController();
    var timer = setTimeout(function () { controller.abort(); }, 65000);
    try {
      var body = Object.assign({ lang: LANG }, payload);
      var response = await fetch("/api/agent", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
        signal: controller.signal
      });
      var data = null;
      try { data = await response.json(); } catch (e) { data = null; }
      if (!response.ok || !data || !data.result) {
        return { ok: false, error: (data && data.error) || t("failed") };
      }
      return { ok: true, result: data.result };
    } catch (err) {
      return { ok: false, error: err && err.name === "AbortError" ? t("slow") : t("failed") };
    } finally {
      clearTimeout(timer);
    }
  }

  async function send() {
    if (busy) return;
    var text = $("agent-input").value.trim();
    if (mode === "analyze" && text.length < 15) {
      setStatus(t("tooShort"), true);
      $("agent-input").focus();
      return;
    }
    busy = true;
    $("agent-send").disabled = true;
    var sendMode = mode;
    var sendLang = LANG;
    setStatus(sendMode === "generate" ? t("statusGen") : t("statusAn"), false);
    var out = await api({ mode: sendMode, text: text });
    if (out.ok) {
      setStatus("", false);
      out.result.__mode = sendMode;
      lastResult = out.result;
      lastResultLang = sendLang;
      renderResult(lastResult, true);
    } else {
      setStatus(out.error || t("failed"), true);
    }
    busy = false;
    $("agent-send").disabled = false;
  }

  function applyMode(next) {
    mode = next;
    var prefix = mode === "generate" ? "generate" : "analyze";
    Array.prototype.forEach.call(document.querySelectorAll(".mode"), function (b) {
      b.setAttribute("aria-pressed", b.getAttribute("data-mode") === mode ? "true" : "false");
    });
    $("agent-label").textContent = t(prefix + "Label");
    $("agent-input").setAttribute("placeholder", t(prefix + "Ph"));
    $("agent-send").textContent = t(prefix + "Btn");

    var ex = $("examples");
    ex.textContent = "";
    t(prefix + "Ex").forEach(function (txt) {
      var b = el("button", { class: "example", type: "button", text: txt });
      b.addEventListener("click", function () {
        $("agent-input").value = txt;
        updateCounter();
        $("agent-input").focus();
      });
      ex.appendChild(b);
    });
    setStatus("", false);
  }

  function updateCounter() {
    $("counter").textContent = $("agent-input").value.length + " / 1200";
  }

  Array.prototype.forEach.call(document.querySelectorAll(".mode"), function (b) {
    b.addEventListener("click", function () { applyMode(b.getAttribute("data-mode")); });
  });
  $("agent-input").addEventListener("input", updateCounter);
  $("agent-input").addEventListener("keydown", function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); send(); }
  });
  $("agent-send").addEventListener("click", send);

  /* ---------- Меню: показываем один раздел за раз ---------- */

  var VIEWS = ["check", "projects", "example", "library", "how"];
  var NAV_KEYS = { check: "navCheck", projects: "navProjects", example: "navExample", library: "navLibrary", how: "navHow" };
  var currentView = "check";

  function showView(name, noScroll) {
    if (VIEWS.indexOf(name) === -1) name = "check";
    currentView = name;
    Array.prototype.forEach.call(document.querySelectorAll(".view"), function (v) {
      v.hidden = v.getAttribute("data-view") !== name;
    });
    Array.prototype.forEach.call(document.querySelectorAll(".nav-b"), function (b) {
      var on = b.getAttribute("data-view") === name;
      b.setAttribute("aria-pressed", on ? "true" : "false");
      if (on) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
    });
    try { if (/^https?:$/.test(location.protocol) && !/^#report=/.test(location.hash)) history.replaceState(null, "", "#" + name); } catch (e) { /* ignore */ }
    if (!noScroll) window.scrollTo({ top: 0, behavior: "smooth" });
  }
  Array.prototype.forEach.call(document.querySelectorAll(".nav-b"), function (b) {
    b.addEventListener("click", function () { showView(b.getAttribute("data-view")); });
  });
  function viewFromHash() {
    var h = (location.hash || "").replace("#", "");
    return VIEWS.indexOf(h) !== -1 ? h : null;
  }
  window.addEventListener("hashchange", function () { var v = viewFromHash(); if (v && v !== currentView) showView(v, true); });
  $("sample-cta").addEventListener("click", goAgent);
  $("to-example").addEventListener("click", function () { showView("example"); });
