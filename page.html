<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>razbor — страница идеи</title>
<meta name="color-scheme" content="light dark">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Golos+Text:wght@400;500;600&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root { --paper:#F6F8FC; --surface:#FFFFFF; --grid:rgba(43,75,219,.10); --ink:#16213E; --muted:#56617F; --line:#C3CCE2; --pen:#2B4BDB; --marker:#FFE14D; --red:#C8372B; }
  @media (prefers-color-scheme: dark) { :root { --paper:#0E1630; --surface:#152042; --grid:rgba(140,165,255,.10); --ink:#E9EDFA; --muted:#9AA6C8; --line:#2C3860; --pen:#9DB0FF; --red:#FF8E81; } }
  *, *::before, *::after { box-sizing: border-box; }
  body { margin:0; background-color:var(--paper); background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px); background-size:28px 28px; color:var(--ink); font:400 1.0625rem/1.6 "Golos Text",system-ui,sans-serif; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 24px 20px 48px; }
  .card { background:var(--surface); border:2px solid var(--ink); border-radius:6px; padding:22px; }
  h1 { margin:0 0 10px; font:700 clamp(1.5rem,5vw,2.2rem)/1.15 "Unbounded","Arial Black",sans-serif; letter-spacing:-.02em; }
  h2 { margin:18px 0 2px; font:600 .92rem "Golos Text",sans-serif; color:var(--muted); }
  p { margin:0; }
  .pitch { font-size:1.12rem; }
  .btns { display:grid; gap:10px; margin:22px 0 8px; }
  button { font:600 1rem "Golos Text",sans-serif; padding:.8rem 1.2rem; border:2px solid var(--ink); border-radius:6px; background:var(--ink); color:var(--paper); cursor:pointer; text-align:left; }
  button.alt { background:var(--marker); color:#16213E; border-color:#16213E; }
  button:disabled { opacity:.6; cursor:default; }
  button:hover:not(:disabled) { transform:translateY(-1px); }
  .note { color:var(--muted); font-size:.85rem; }
  .thanks { margin:10px 0 0; font:600 1.4rem "Caveat",cursive; color:var(--pen); min-height:1.6em; }
  .foot { margin-top:18px; font-size:.85rem; color:var(--muted); display:flex; flex-wrap:wrap; gap:6px 16px; align-items:center; }
  .foot a, .linkbtn { color:var(--pen); }
  .linkbtn { background:none; border:0; padding:0; font:500 .85rem "Golos Text",sans-serif; text-decoration:underline; text-align:left; }
  .err { color:var(--red); }
  :focus-visible { outline:3px solid var(--pen); outline-offset:3px; }
</style>
</head>
<body>
<div class="wrap">
  <main class="card" id="card" aria-live="polite"><p id="loading">…</p></main>
  <div class="foot" id="foot"></div>
</div>
<script>
(function () {
  "use strict";
  var TX = {
    ru: { need: "Мне это нужно", pay: "Заплатил бы за это", sub: "Это тест идеи: оплаты здесь нет, кнопки только отмечают интерес. Ничего вводить не нужно.", thanks: "Спасибо, ответ записан.", already: "Ты уже отвечал.",
      aud: "Для кого", pain: "Какую проблему решает", report: "Пожаловаться", reported: "Спасибо, жалоба отправлена.", madeBy: "Страница создана на razbor.", cta: "Проверь свою идею", gone: "Страница не найдена или скрыта.", fail: "Не получилось загрузить страницу." },
    en: { need: "I need this", pay: "I would pay for this", sub: "This is an idea test: there is no payment here, the buttons only mark interest. You do not need to enter anything.", thanks: "Thanks, your answer is recorded.", already: "You already answered.",
      aud: "Who it is for", pain: "The problem it solves", report: "Report", reported: "Thanks, the report was sent.", madeBy: "Page made on razbor.", cta: "Validate your idea", gone: "The page was not found or is hidden.", fail: "Could not load the page." }
  };
  var m = /^\/p\/([a-f0-9]{10})\/?$/.exec(location.pathname);
  var id = m ? m[1] : (new URLSearchParams(location.search).get("id") || "");
  var card = document.getElementById("card"), foot = document.getElementById("foot");
  function el(tag, props, kids) {
    var n = document.createElement(tag);
    Object.keys(props || {}).forEach(function (k) { if (k === "text") n.textContent = props[k]; else if (k === "class") n.className = props[k]; else n.setAttribute(k, props[k]); });
    (kids || []).forEach(function (c) { if (c) n.appendChild(c); });
    return n;
  }
  function post(type) {
    return fetch("/api/page", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ action: "event", id: id, type: type }) })
      .then(function (r) { return r.json(); }).catch(function () { return null; });
  }
  function done(type) { try { return localStorage.getItem("razbor.page." + id + "." + type) === "1"; } catch (e) { return false; } }
  function mark(type) { try { localStorage.setItem("razbor.page." + id + "." + type, "1"); } catch (e) { /* ignore */ } }

  fetch("/api/page?id=" + encodeURIComponent(id)).then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); }).then(function (res) {
    card.textContent = "";
    var lang = res.ok && res.d.page && res.d.page.lang === "en" ? "en" : "ru";
    var T = TX[lang];
    document.documentElement.lang = lang;
    if (!res.ok) { card.appendChild(el("p", { class: "err", text: res.d && res.d.code === "storage" ? res.d.error : T.gone })); return; }
    var p = res.d.page;
    document.title = p.title + " — razbor";
    card.appendChild(el("h1", { text: p.title }));
    card.appendChild(el("p", { class: "pitch", text: p.pitch }));
    if (p.audience) { card.appendChild(el("h2", { text: T.aud })); card.appendChild(el("p", { text: p.audience })); }
    if (p.pain) { card.appendChild(el("h2", { text: T.pain })); card.appendChild(el("p", { text: p.pain })); }
    var thanks = el("p", { class: "thanks", role: "status" });
    var btns = el("div", { class: "btns" });
    [["need", T.need, ""], ["pay", T.pay, "alt"]].forEach(function (b) {
      var btn = el("button", { type: "button", class: b[2], text: b[1] });
      if (done(b[0])) { btn.disabled = true; }
      btn.addEventListener("click", function () {
        btn.disabled = true; mark(b[0]);
        post(b[0]).then(function () { thanks.textContent = T.thanks; });
      });
      btns.appendChild(btn);
    });
    card.appendChild(btns);
    card.appendChild(el("p", { class: "note", text: T.sub }));
    card.appendChild(thanks);
    var rep = el("button", { type: "button", class: "linkbtn", text: T.report });
    if (done("report")) rep.disabled = true;
    rep.addEventListener("click", function () { rep.disabled = true; mark("report"); post("report").then(function () { rep.textContent = T.reported; }); });
    foot.appendChild(el("span", { text: T.madeBy + " " }));
    foot.appendChild(el("a", { href: "/", text: T.cta }));
    foot.appendChild(rep);
    if (!done("view")) { mark("view"); }
    post("view");
  }).catch(function () { card.textContent = ""; card.appendChild(el("p", { class: "err", text: TX.ru.fail })); });
})();
</script>
</body>
</html>
